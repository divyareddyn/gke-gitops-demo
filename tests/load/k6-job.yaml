# Repeatable in-cluster load generator (k6). Runs as the "loadgen" identity,
# which is the ONLY client the NetworkPolicy allows to reach podinfo.
# __VUS__ and __DURATION__ are filled in from config.env by scripts/09-loadtest.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: loadgen
data:
  load.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      vus: __VUS__,
      duration: '__DURATION__',
      thresholds: { http_req_failed: ['rate<0.01'] },
    };

    export default function () {
      const res = http.get('http://podinfo.demo.svc.cluster.local/');
      check(res, { 'status is 200': (r) => r.status === 200 });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: loadgen
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: k6
          image: docker.io/grafana/k6:1.7.1
          args: ["run", "--summary-trend-stats=avg,p(95),p(99),max", "/scripts/load.js"]
          resources:
            requests: { cpu: 500m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: script
          configMap: { name: k6-script }
        - name: tmp
          emptyDir: {}
