# Least-privilege Argo CD project: it may only deploy from OUR repo, only into
# the "demo" namespace, and only the resource kinds this app actually uses.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  description: Demo workload — one repo, one namespace, limited kinds
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.destinationNamespace }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: "", kind: ConfigMap }
    - { group: apps, kind: Deployment }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: networking.k8s.io, kind: NetworkPolicy }
