# Minimal Argo CD for a sandbox. Everything not needed is switched off.
dex:
  enabled: false          # no SSO in the sandbox; admin login only
notifications:
  enabled: false

configs:
  cm:
    # GitHub can't send webhooks into a private cluster, so Argo CD polls.
    # Poll every 60s (+ up to 10s jitter) instead of the default 120s (+60s).
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 10s
  params:
    server.insecure: true # TLS is terminated by kubectl port-forward locally; the server is never exposed

server:
  service:
    type: ClusterIP       # no public LoadBalancer
  resources:
    requests: { cpu: 50m, memory: 128Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }

applicationSet:
  replicas: 0             # not used in this demo

redis:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
